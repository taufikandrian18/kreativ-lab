# nginx site for the static build of Kreative Studio Lab.
# Install once on the VPS:
#   sudo cp nginx.conf /etc/nginx/sites-available/kreativ-lab
#   sudo sed -i 's/YOUR_DOMAIN/kreativestudiolab.com/g' /etc/nginx/sites-available/kreativ-lab
#   sudo ln -s /etc/nginx/sites-available/kreativ-lab /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS afterwards:  sudo certbot --nginx -d YOUR_DOMAIN

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    root /var/www/kreativ-lab;
    index index.html;

    # Clean URLs: /about -> /about/index.html (the build uses trailing slashes).
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Hashed build assets never change under the same name — cache them for a year.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Deck imagery, gallery tiles, logos and video change only on redeploy.
    location ~* ^/(deck|gallery|logos|pillars|panels|video|images)/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # MP4 needs byte-range requests for iOS Safari to play inline; nginx serves them
    # natively, so there is nothing to add here beyond not compressing video.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    error_page 404 /404.html;
}
