; PHP's default 2 MB upload limit rejects nearly every campaign photograph. The site
; resizes images at build time, so editors can upload the originals.
;
; 256 MB covers a full-length reel as exported. Videos are NOT shrunk by the build: what
; is uploaded is what visitors download (see docs/editing-content.md), so the limit is
; what WordPress accepts, not a size to aim for.
upload_max_filesize = 256M
; The whole request must fit, file plus form fields, so it is a little larger.
post_max_size = 260M
; Uploads are streamed to a temporary file, not held in memory, so this stays as it was:
; raising it would let every PHP worker claim more of a VPS shared with other apps.
memory_limit = 256M
; Time for a slow connection to finish sending a large file before PHP gives up.
max_input_time = 300
max_execution_time = 300
